name: Build and Deploy to Vodien

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Get Latest Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Test
        run: pnpm nx run-many -t lint typecheck test

      - name: Build Project with Nx
        run: pnpm build

      - name: Bundle API into Build
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          VISITOR_SALT: ${{ secrets.VISITOR_SALT }}
        run: |
          mkdir -p apps/frontend/dist/api
          cp -r apps/backend/index.php apps/backend/.htaccess apps/backend/src apps/frontend/dist/api/
          php -r 'file_put_contents("apps/frontend/dist/api/config.php", "<?php\n\ndeclare(strict_types=1);\n\nreturn " . var_export(["host" => "localhost", "name" => getenv("DB_NAME"), "user" => getenv("DB_USER"), "password" => getenv("DB_PASSWORD"), "salt" => getenv("VISITOR_SALT")], true) . ";\n");'

      - name: Resolve FTP Host for Certificate Checks
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_CERT_SUFFIX: .vodien.com
        run: |
          FTP_HOST=$(bash .github/scripts/resolve-ftp-host.sh)
          echo "::add-mask::$FTP_HOST"
          echo "FTP_HOST=$FTP_HOST" >> "$GITHUB_ENV"

      - name: Clear Previous Build on Server
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftps://$FTP_HOST:21" <<'EOF'
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          set ssl:ca-file /etc/ssl/certs/ca-certificates.crt
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          rm -rf assets
          rm -rf api
          rm -f index.html favicon.ico
          rm -f .ftp-deploy-sync-state.json
          bye
          EOF

      - name: Deploy Build via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./apps/frontend/dist/
          server-dir: ./